# Swarmarchy ISO build (aarch64 / Snapdragon X Elite target)
#
# Replaces the old nightly-build.yml, which referenced a nonexistent `build_iso.sh`
# and built for x86_64. This workflow mirrors the real local flow in
# `bin/swarmarchy-iso-make` (privileged Arch container running `builder/build-iso.sh`),
# but on a native arm64 runner with an Arch Linux ARM base image.
#
# ──────────────────────────────────────────────────────────────────────────────
# ⚠️  This does NOT yet produce a bootable ISO. The aarch64 surgery is already done
#     (profiledef arch=aarch64, build-iso.sh ARCH/packages.$ARCH, ALARM mirror,
#     archlinuxarm-keyring, arm64 Node). What remains is the hard part:
#       • archiso's `releng` profile is x86_64-only (no aarch64 profile) — likely
#         switch the builder to `archboot`.
#       • the Snapdragon kernel + Qualcomm firmware + DTB still need bundling.
#     Expect the build to fail around the offline-mirror / releng-aarch64 step —
#     that's the known frontier, not a regression. Run via workflow_dispatch to
#     exercise the pipeline up to that point.
#     Full blocker list + plan: BUILD-AARCH64.md.
# ──────────────────────────────────────────────────────────────────────────────

name: Build ISO (aarch64)

on:
  workflow_dispatch:
    inputs:
      installer_ref:
        description: "swarmarchy installer git ref (branch/tag)"
        required: false
        # The Sway/aarch64 layer lives on rename-swarmarchy; switch back to
        # "master" once that branch is merged.
        default: "rename-swarmarchy"
      mirror:
        description: "Package mirror channel (stable|rc|edge)"
        required: false
        default: "stable"
  # Nightly schedule disabled: the build can't succeed yet (known blockers above),
  # so a cron would just email a failure every day. Re-enable once it produces an ISO.
  # schedule:
  #   - cron: "1 0 * * *" # nightly at 00:01 UTC

permissions:
  contents: read

env:
  # Native arm64 Arch image. Swap if you prefer menci/archlinuxarm etc.
  ARCH_BASE_IMAGE: "lopsided/archlinux-arm64v8:latest"
  SWARMARCHY_INSTALLER_REPO: "RAH-SOFTWARE-HOLDINGS-LTD/swarmarchy"
  SWARMARCHY_INSTALLER_REF: ${{ github.event.inputs.installer_ref || 'rename-swarmarchy' }}
  SWARMARCHY_MIRROR: ${{ github.event.inputs.mirror || 'stable' }}

jobs:
  build-iso:
    # GitHub-hosted native arm64 runner (no qemu emulation needed).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    steps:
      - name: Checkout (with archiso submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare output dir
        run: mkdir -p release

      - name: Build ISO in privileged Arch (ARM) container
        run: |
          set -euxo pipefail
          docker run --rm --privileged \
            -e "SWARMARCHY_INSTALLER_REPO=${SWARMARCHY_INSTALLER_REPO}" \
            -e "SWARMARCHY_INSTALLER_REF=${SWARMARCHY_INSTALLER_REF}" \
            -e "SWARMARCHY_MIRROR=${SWARMARCHY_MIRROR}" \
            -e "HOST_UID=$(id -u)" \
            -e "HOST_GID=$(id -g)" \
            -v "${GITHUB_WORKSPACE}/release:/out" \
            -v "${GITHUB_WORKSPACE}/archiso:/archiso:ro" \
            -v "${GITHUB_WORKSPACE}/builder:/builder:ro" \
            -v "${GITHUB_WORKSPACE}/configs:/configs:ro" \
            "${ARCH_BASE_IMAGE}" \
            /builder/build-iso.sh

      - name: List build output
        if: always()
        run: ls -lh release/ || true

      - name: Upload ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: swarmarchy-iso-${{ github.run_number }}
          path: release/*.iso
          retention-days: 14
          if-no-files-found: error
