#
# Arch Linux ARM pacman config for the swarmarchy ISO builder (generic).
# Standard ALARM mirror + AUR only — no omarchy.org mirror, no custom repo.
#
[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[swarmarchy]
# Custom aarch64 packages not in Arch Linux ARM: walker, the elephant launcher stack, yay,
# mise-bin, and small AUR utils. Hosted on the user's Cloudflare R2 bucket (swarmarchy-pkgs).
# UNSIGNED for now -> Optional TrustAll (add GPG signing later, then tighten to Required).
# NOTE: all channels point at the stable/ bucket path until rc/edge channels are populated.
SigLevel = Optional TrustAll
Server = https://pub-94007937245e4d81848717760f9dfc75.r2.dev/stable/$arch
