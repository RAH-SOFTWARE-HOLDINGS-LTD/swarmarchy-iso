# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Use graphics-mode output
insmod font
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    set gfxmode="auto"
    terminal_input console
    terminal_output gfxterm
fi

# Enable serial console
insmod serial
insmod usbserial_common
insmod usbserial_ftdi
insmod usbserial_pl2303
insmod usbserial_usbdebug
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
    if [ "${grub_cpu}" == 'x86_64' ]; then
        archiso_platform="x64 ${archiso_platform}"
    elif [ "${grub_cpu}" == 'i386' ]; then
        archiso_platform="IA32 ${archiso_platform}"
    else
        archiso_platform="${grub_cpu} ${archiso_platform}"
    fi
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu} ${grub_platform}"
fi

# aarch64: Snapdragon X laptops boot via device tree, not ACPI, and GRUB's `devicetree` (fdt
# module) must hand the kernel the right board DTB. Pick it from SMBIOS type 1 Manufacturer
# (offset 4) and Product Name (offset 5): boards-match.cfg, generated from configs/boards.tsv
# by builder/generate-grub-boards.sh, sets board_dtb/board_name on a match. The DTBs sit in
# /boot/grub/ (mkarchiso copies the profile's grub/ dir there).
insmod smbios
set smb_vendor=""
set smb_product=""
smbios --type 1 --get-string 4 --set smb_vendor
smbios --type 1 --get-string 5 --set smb_product
set board_dtb=""
set board_name=""
source /boot/grub/boards-match.cfg

# Kernel arguments for this boot medium; boards-menu.cfg's entries reuse them.
set swarm_linux_args="archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%"

# Set default menu entry. A recognised laptop boots straight away, as before; anything else
# waits on the menu so the user can pick their laptop from boards-menu.cfg.
if [ -n "${board_dtb}" ]; then
    default=archlinux
    timeout=0
    timeout_style=hidden
else
    timeout=-1
    timeout_style=menu
fi


# Menu entries

# swarmarchy.devicetree= tells the installer (swarmarchy-hw-snapdragon dtb) which DTB this boot used.
# Never name it anything containing "dtb=": the kernel's EFI stub matches that substring anywhere
# on the cmdline (drivers/firmware/efi/libstub/fdt.c) and prints "ERROR: Ignoring DTB from
# command line." -- which is what the first generic ISO (2026-11-19) showed on the Yoga.
if [ -n "${board_dtb}" ]; then
    menuentry "Swarmarchy (${board_name}, ${archiso_platform})" --class arch --class gnu-linux --class gnu --class os --id 'archlinux' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux ${swarm_linux_args} swarmarchy.devicetree=dtbs/qcom/${board_dtb}
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
        devicetree /boot/grub/${board_dtb}
    }

    menuentry "Swarmarchy with speakup screen reader (${board_name}, ${archiso_platform})" --hotkey s --class arch --class gnu-linux --class gnu --class os --id 'archlinux-accessibility' {
        set gfxpayload=keep
        linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux ${swarm_linux_args} swarmarchy.devicetree=dtbs/qcom/${board_dtb} accessibility=on
        initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
        devicetree /boot/grub/${board_dtb}
    }
fi

# One entry per Snapdragon X device tree the kernel ships, for machines boards.tsv does not
# know. A recognised machine boots without showing this; a wrong match is fixed in boards.tsv.
source /boot/grub/boards-menu.cfg


if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Run Memtest86+ (RAM test)' --class memtest86 --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellx64.efi
        }
    elif [ "${grub_cpu}" == "i386" -a -f '/shellia32.efi' ]; then
        menuentry 'UEFI Shell' --class efi {
            chainloader /shellia32.efi
        }
    fi

    menuentry 'UEFI Firmware Settings' --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'System shutdown' --class shutdown --class poweroff {
    echo 'System shutting down...'
    halt
}

menuentry 'System restart' --class reboot --class restart {
    echo 'System rebooting...'
    reboot
}


