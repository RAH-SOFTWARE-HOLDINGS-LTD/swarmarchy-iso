#
# Example aarch64 pacman config for the ISO builder.
#
# The default pacman-online-{stable,rc,edge}.conf point at omarchy.org mirrors,
# which serve x86_64 ONLY. For an aarch64 build you must source packages from an
# Arch Linux ARM (ALARM) mirror instead. Copy/adapt this and wire it into
# builder/build-iso.sh (the `pacman --config pacman-online-${SWARMARCHY_MIRROR}.conf`
# lines) — or rename it to match your chosen channel.
#
# CAVEATS:
#  - ALARM repo names are core/extra/community/alarm/aur (NO `multilib`).
#  - Swarmarchy's custom packages (walker, swarmarchy-*) are NOT on ALARM. They must be
#    rebuilt for aarch64 and hosted (custom repo) or installed from AUR post-boot.
#  - For Snapdragon X you also need a patched kernel + Qualcomm firmware, which
#    ALARM's generic linux-aarch64 does not provide out of the box.

[options]
HoldPkg     = pacman glibc
Architecture = aarch64
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo

# TODO: add a [swarmarchy] repo here once you host aarch64 builds of walker,
# linux-x1e, displaylink/evdi, yay, etc.
# [swarmarchy]
# SigLevel = Optional TrustAll
# Server = https://your-host/aarch64
