# archiso HOOKS for aarch64 (Snapdragon X Elite). Trimmed from the x86 releng set:
# - microcode: x86-only CPU ucode; ALARM has none.
# - memdisk: needs memdiskfind from syslinux (x86 BIOS); not built for uefi.grub.
# - archiso_pxe_*: netboot (phram/PXE); not a use case for this offline installer ISO.
# - plymouth: not shipped/needed for the live installer.
# This drop-in is auto-sourced, so these HOOKS apply to the stock linux-aarch64.preset's
# default image (/boot/initramfs-linux.img).
HOOKS=(base udev modconf kms archiso block filesystems keyboard)
